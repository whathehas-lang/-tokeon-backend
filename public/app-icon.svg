<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#334155" stroke-width="8" />
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyan)" stroke-width="6" opacity="0.4" stroke-dasharray="16 12" />
  
  <!-- Sports Shield / Trophy Icon -->
  <path d="M256 90 L380 150 V260 C380 345 256 420 256 420 C256 420 132 345 132 260 V150 Z" fill="url(#bg)" stroke="url(#gold)" stroke-width="14" />
  
  <!-- Inner Baseball / Football / Trophy Emblem -->
  <circle cx="256" cy="230" r="60" fill="none" stroke="url(#cyan)" stroke-width="10" />
  <path d="M220 200 Q256 230 220 260" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  <path d="M292 200 Q256 230 292 260" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  
  <!-- Star on Top -->
  <polygon points="256,125 264,145 285,145 268,158 274,178 256,165 238,178 244,158 227,145 248,145" fill="url(#gold)" />
  
  <!-- Text Label -->
  <text x="256" y="365" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="900" letter-spacing="4">SPORTS FACT</text>
  <text x="256" y="460" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700">스포츠의 모든것 v2</text>
</svg>
